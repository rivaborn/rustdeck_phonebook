<tr id="computer-{{ computer.id }}">
  <td data-label="Name" class="wrap cell-name">
    <button type="button" hx-get="/computers/{{ computer.id }}" hx-target="#modal" hx-swap="innerHTML" class="clickable">{{ computer.friendly_name or 'Unnamed Computer' }}</button>
  </td>
  <td data-label="RustDesk ID" class="mono">{{ computer.rustdesk_id }}</td>
  <td data-label="OS" class="wrap">{{ computer.operating_system or 'N/A' }}</td>
  <td data-label="Location" class="wrap">{{ computer.location or 'N/A' }}</td>
  <td data-label="Tags">
    {% if computer.tags %}
      <div class="tags">
      {% for tag in computer.tags.split(',') %}
        <span class="tag">{{ tag.strip() }}</span>
      {% endfor %}
      </div>
    {% else %}
      <span class="muted">N/A</span>
    {% endif %}
  </td>
  <td data-label="Updated" class="mono muted"><time datetime="{{ computer.updated_at }}" title="{{ computer.updated_at }}">{{ (computer.updated_at | string)[:10] }}</time></td>
  <td class="cell-actions">
    <div class="actions">
      <button type="button" onclick="copyToClipboard('{{ computer.rustdesk_id }}')" class="btn btn-ghost btn-icon" aria-label="Copy RustDesk ID {{ computer.rustdesk_id }}" title="Copy ID"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button>
      <button hx-get="/computers/{{ computer.id }}/edit" hx-target="#modal" class="btn btn-ghost btn-icon" aria-label="Edit {{ computer.friendly_name or 'computer' }}" title="Edit"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
      <button hx-delete="/computers/{{ computer.id }}" hx-confirm="Are you sure you want to delete this computer?" hx-target="closest tr" hx-swap="outerHTML" class="btn btn-danger btn-icon" aria-label="Delete {{ computer.friendly_name or 'computer' }}" title="Delete"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg></button>
    </div>
  </td>
</tr>
