{% set editing = computer and computer.id %}
<div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="form-heading">
<h2 id="form-heading">{{ "Edit computer" if editing else "Add computer" }}</h2>
<form
  {% if editing %}
    hx-put="/computers/{{ computer.id }}"
    hx-target="#computer-{{ computer.id }}"
    hx-swap="outerHTML"
  {% else %}
    hx-post="/computers"
    hx-target="#computer-table-body"
    hx-swap="afterbegin"
  {% endif %}
  class="computer-form">

  {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}

  <div class="form-group">
    <label for="friendly_name">Friendly Name</label>
    <input type="text" id="friendly_name" aria-describedby="friendly_name-error" name="friendly_name" value="{{ computer.friendly_name or '' }}" required>
    <span class="field-error" role="alert" id="friendly_name-error"></span>
  </div>

  <div class="form-group">
    <label for="rustdesk_id">RustDesk ID</label>
    <input type="text" id="rustdesk_id" aria-describedby="rustdesk_id-error" name="rustdesk_id" value="{{ computer.rustdesk_id or '' }}" required>
    <span class="field-error" role="alert" id="rustdesk_id-error"></span>
  </div>

  <div class="form-group">
    <label for="hostname">Hostname</label>
    <input type="text" id="hostname" aria-describedby="hostname-error" name="hostname" value="{{ computer.hostname or '' }}">
    <span class="field-error" role="alert" id="hostname-error"></span>
  </div>

  <div class="form-group">
    <label for="local_ip">Local IP</label>
    <input type="text" id="local_ip" aria-describedby="local_ip-error" name="local_ip" value="{{ computer.local_ip or '' }}">
    <span class="field-error" role="alert" id="local_ip-error"></span>
  </div>

  <div class="form-group">
    <label for="operating_system">Operating System</label>
    <input type="text" id="operating_system" aria-describedby="operating_system-error" name="operating_system" value="{{ computer.operating_system or '' }}">
    <span class="field-error" role="alert" id="operating_system-error"></span>
  </div>

  <div class="form-group">
    <label for="username">Username</label>
    <input type="text" id="username" aria-describedby="username-error" name="username" value="{{ computer.username or '' }}">
    <span class="field-error" role="alert" id="username-error"></span>
  </div>

  <div class="form-group">
    <label for="location">Location</label>
    <input type="text" id="location" aria-describedby="location-error" name="location" value="{{ computer.location or '' }}">
    <span class="field-error" role="alert" id="location-error"></span>
  </div>

  <div class="form-group">
    <label for="notes">Notes</label>
    <textarea id="notes" aria-describedby="notes-error" name="notes">{{ computer.notes or '' }}</textarea>
    <span class="field-error" role="alert" id="notes-error"></span>
  </div>

  <div class="form-group">
    <label for="tags">Tags</label>
    <input type="text" id="tags" aria-describedby="tags-error" name="tags" value="{{ computer.tags or '' }}" placeholder="e.g. office, windows">
    <span class="field-error" role="alert" id="tags-error"></span>
  </div>

  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Save</button>
    <button type="button" class="btn btn-secondary" onclick="document.getElementById('modal').innerHTML = '';">Cancel</button>
  </div>
</form>
</div>
