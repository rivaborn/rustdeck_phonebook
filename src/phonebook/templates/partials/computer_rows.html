{% for computer in computers %}
    {% include "partials/computer_row.html" %}
{% else %}
    <tr class="empty-row">
        <td colspan="7" class="empty-cell">
            <div class="empty-state">
                {% if query %}
                <p>No computers match “{{ query }}”. Try a name, ID, hostname, IP or tag.</p>
                {% else %}
                <p>No computers yet. Add the first one to start your phone book.</p>
                {% endif %}
                <button class="btn btn-primary" hx-get="/computers/new" hx-target="#modal" hx-swap="innerHTML">Add computer</button>
            </div>
        </td>
    </tr>
{% endfor %}
