{% extends "base.html" %}

{% block content %}
<section class="panel table-card" aria-labelledby="computers-heading">
    <div class="section-head">
        <h2 id="computers-heading">Computers</h2>
        <span class="muted">{{ computers | length }} total</span>
    </div>
    <div class="table-wrap">
        <table class="table">
            <thead>
                <tr>
                    <th scope="col">Friendly name</th>
                    <th scope="col">RustDesk ID</th>
                    <th scope="col">OS</th>
                    <th scope="col">Location</th>
                    <th scope="col">Tags</th>
                    <th scope="col">Updated</th>
                    <th scope="col"><span class="visually-hidden">Actions</span></th>
                </tr>
            </thead>
            <tbody id="computer-table-body">
                {% include "partials/computer_rows.html" %}
            </tbody>
        </table>
    </div>
</section>
{% endblock %}
