<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RustDesk Phone Book</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="/static/app.js" defer></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="page">
        <header class="app-header">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
                </span>
                <h1>RustDesk Phone Book</h1>
            </div>
            <button class="btn btn-primary" hx-get="/computers/new" hx-target="#modal" hx-swap="innerHTML">Add computer</button>
            <div class="toolbar">
                <div class="search">
                    <label for="search-input" class="visually-hidden">Search computers</label>
                    <svg class="search-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                    <input type="search" id="search-input" name="q" class="input" placeholder="Search computers…" autocomplete="off" hx-get="/computers/search" hx-target="#computer-table-body" hx-trigger="input changed delay:300ms, search" hx-indicator="#computer-table-body">
                </div>
                <nav class="export-nav" aria-label="Export">
                    <a class="btn btn-ghost btn-sm" href="/export/json">Export JSON</a>
                    <a class="btn btn-ghost btn-sm" href="/export/csv">Export CSV</a>
                </nav>
            </div>
        </header>
        <main id="content">
            {% block content %}{% endblock %}
        </main>
    </div>
    <div id="modal"></div>
</body>
</html>
